<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Left Side: Copy & Hook -->
  <g transform="translate(80, 140)">
    <!-- Badge -->
    <rect width="130" height="32" rx="16" fill="#1f293d" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="65" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>

    <!-- Headline -->
    <text x="0" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">WTF</text>
    
    <text x="0" y="145" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">
      Your coding agent says it’s done.
    </text>
    <text x="0" y="180" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">
      WTF checks.
    </text>

    <text x="0" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Any agent. Any Git repo. Local-first. Zero AI required.
    </text>

    <!-- Command Pill -->
    <g transform="translate(0, 275)">
      <rect width="280" height="52" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#38bdf8" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="17" font-weight="600">$</text>
      <text x="44" y="32" fill="#e2e8f0" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="17" font-weight="600">npx agent-wtf</text>
    </g>
  </g>

  <!-- Right Side: Terminal Window Preview -->
  <g transform="translate(640, 100)" filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect width="560" height="440" rx="14" fill="#0b0f17" stroke="#222f44" stroke-width="1.5"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>
    
    <!-- Tab Title -->
    <text x="280" y="28" fill="#64748b" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" text-anchor="middle">terminal — wtf verify</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#1a2333" stroke-width="1"/>

    <!-- Terminal Content -->
    <g transform="translate(28, 75)" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" line-height="1.5">
      <text y="0" fill="#38bdf8" font-weight="700">WTF</text>
      <text x="35" y="0" fill="#94a3b8">— what just happened?</text>
      <text y="24" fill="#64748b">2 files changed · </text>
      <text x="135" y="24" fill="#10b981">+7</text>
      <text x="155" y="24" fill="#64748b"> / </text>
      <text x="175" y="24" fill="#ef4444">-5</text>

      <!-- VERIFIED SECTION -->
      <text y="64" fill="#f8fafc" font-weight="700" letter-spacing="0.5">VERIFIED</text>
      <text y="88" fill="#10b981">✓</text>
      <text x="20" y="88" fill="#e2e8f0">tests</text>
      <text x="140" y="88" fill="#64748b">31/31 passed</text>
      <text x="260" y="88" fill="#475569">(220ms)</text>

      <!-- PAY ATTENTION SECTION -->
      <text y="132" fill="#f8fafc" font-weight="700" letter-spacing="0.5">PAY ATTENTION</text>
      <text y="156" fill="#f59e0b">1. TESTS</text>
      <text x="75" y="156" fill="#cbd5e1">Test skipped or disabled</text>
      <text y="178" fill="#64748b">   test/charge.test.js:9</text>
      <text y="200" fill="#ef4444">   &gt; test.skip('handles VIP coupon cap calculation')</text>

      <!-- ALSO SECTION -->
      <text y="242" fill="#f8fafc" font-weight="700" letter-spacing="0.5">ALSO</text>
      <text y="266" fill="#f59e0b">⚠ 1 skipped test</text>
      <text y="288" fill="#f59e0b">⚠ 1 debug statement (console.log)</text>

      <!-- REVIEW SURFACE -->
      <text y="330" fill="#94a3b8">Review surface:</text>
      <text y="352" fill="#38bdf8" font-weight="600">  11 meaningful lines to review (97% compressed)</text>
    </g>
  </g>
</svg>
